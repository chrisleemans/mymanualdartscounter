<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Darts Counter — Practice Edition</title>
<style>
  :root {
    --board-green: #1B2B26;
    --surface: rgba(255,255,255,0.06);
    --border-soft: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.18);
    --chalk: #F4F0E6;
    --chalk-dim: #9CA8A0;
    --accent-yellow: #E8C547;
    --accent-red: #E0573E;
    --accent-green: #5FCB8C;
    --shadow: rgba(0,0,0,0.5);
    --cream: #F4F0E6;
    --radius: 18px;
    --radius-sm: 12px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
  }

  html {
    background: #0a0d0c;
  }

  body {
    color: var(--chalk);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 16px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    position: relative;
    overflow-x: hidden;
  }

  /* Real dartboard background, fixed behind everything */
  .board-bg {
    position: fixed;
    top: 50%;
    left: 50%;
    width: max(900px, 110vmin);
    height: max(900px, 110vmin);
    transform: translate(-50%, -50%);
    z-index: 0;
    pointer-events: none;
  }
  .board-bg svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: saturate(0.85);
  }
  .board-veil {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(circle at 50% 42%, rgba(10,13,12,0.35) 0%, rgba(10,13,12,0.78) 60%, rgba(10,13,12,0.94) 100%);
    pointer-events: none;
  }

  .app {
    width: 100%;
    max-width: 640px;
    position: relative;
    z-index: 1;
  }

  /* ---------- Glass panel base ---------- */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 8px 32px var(--shadow);
  }

  /* ---------- Setup screen ---------- */
  .setup-card {
    padding: 24px;
  }
  .setup-card h2 {
    letter-spacing: 1px;
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 18px;
    color: var(--cream);
  }
  .form-row {
    margin-bottom: 14px;
  }
  .form-row label {
    display: block;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--chalk-dim);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .form-row input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    font-weight: 500;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    background: rgba(0,0,0,0.25);
    color: var(--chalk);
  }
  .form-row input::placeholder {
    color: var(--chalk-dim);
    opacity: 0.6;
  }
  .form-row input:focus {
    outline: none;
    border-color: var(--accent-yellow);
    box-shadow: 0 0 0 3px rgba(232,197,71,0.18);
  }
  .start-select {
    display: flex;
    gap: 8px;
  }
  .start-select button {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    font-weight: 700;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    background: rgba(0,0,0,0.2);
    color: var(--chalk);
    cursor: pointer;
    transition: all 0.15s;
    -webkit-appearance: none;
  }
  .start-select button.active {
    background: var(--accent-yellow);
    color: #2c2300;
    border-color: var(--accent-yellow);
  }

  .big-btn {
    width: 100%;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--accent-yellow);
    color: #2c2300;
    cursor: pointer;
    margin-top: 4px;
    transition: transform 0.08s, opacity 0.12s, background 0.12s;
    -webkit-appearance: none;
    touch-action: manipulation;
  }
  .big-btn:active {
    transform: scale(0.97);
  }
  .big-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  /* ---------- Game screen ---------- */
  .game {
    display: none;
  }
  .game.active {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .scoreboard {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .player-panel {
    padding: 14px 10px;
    text-align: center;
    transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s, opacity 0.25s;
    opacity: 0.45;
    transform: scale(0.96);
  }
  .player-panel.active-player {
    border-color: var(--accent-yellow);
    box-shadow: 0 0 0 1px rgba(232,197,71,0.5), 0 8px 32px rgba(232,197,71,0.15);
    opacity: 1;
    transform: scale(1);
  }
  /* single player: always full opacity */
  .player-panel:only-child {
    opacity: 1;
    transform: scale(1);
  }
  .player-name {
    font-size: 12px;
    letter-spacing: 1px;
    font-weight: 600;
    color: var(--chalk-dim);
    margin: 0 0 4px;
    min-height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .player-name.is-turn {
    color: var(--chalk);
  }
  .player-name .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-yellow);
    opacity: 0;
    flex-shrink: 0;
  }
  .player-name.is-turn .dot {
    opacity: 1;
  }
  .turn-tag {
    display: none;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #2c2300;
    background: var(--accent-yellow);
    border-radius: 4px;
    padding: 2px 6px;
    margin-bottom: 6px;
  }
  .active-player .turn-tag {
    display: inline-block;
  }
  .player-score {
    font-family: 'Courier New', monospace;
    font-size: clamp(38px, 14vw, 58px);
    font-weight: 700;
    line-height: 1;
    margin: 0;
    letter-spacing: 1px;
    color: var(--chalk-dim);
    transition: color 0.25s, font-size 0.25s;
  }
  .active-player .player-score {
    color: var(--cream);
    font-size: clamp(46px, 16vw, 68px);
  }
  /* ---------- Entry panel ---------- */
  .entry-panel {
    padding: 16px;
  }
  .entry-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-yellow);
    margin: 0 0 14px;
    text-align: center;
    letter-spacing: 0.5px;
  }

  .entry-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .entry-field {
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border-soft);
    cursor: pointer;
    transition: border-color 0.12s, box-shadow 0.12s, background 0.12s;
  }
  .entry-field.focused {
    border-color: var(--accent-yellow);
    box-shadow: 0 0 0 3px rgba(232,197,71,0.18);
    background: rgba(232,197,71,0.06);
  }
  .entry-field label {
    display: block;
    font-size: 10.5px;
    letter-spacing: 1px;
    color: var(--chalk-dim);
    font-weight: 600;
    margin-bottom: 2px;
  }
  .entry-field .value {
    font-family: 'Courier New', monospace;
    font-size: clamp(22px, 6vw, 28px);
    font-weight: 700;
    color: var(--cream);
    min-height: 30px;
    line-height: 1.2;
  }
  .entry-field .value.placeholder {
    color: var(--chalk-dim);
    opacity: 0.6;
    font-weight: 600;
  }
  .entry-field.disabled {
    opacity: 0.45;
    cursor: default;
  }

  /* quick throw buttons */
  .quick-section-label {
    font-size: 10.5px;
    letter-spacing: 1px;
    color: var(--chalk-dim);
    font-weight: 600;
    margin: 0 0 8px;
    text-align: center;
  }
  .quick-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-bottom: 14px;
  }
  .quick-btn {
    padding: 10px 4px;
    font-family: 'Courier New', monospace;
    font-size: 16px;
    font-weight: 700;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    background: rgba(0,0,0,0.2);
    color: var(--cream);
    cursor: pointer;
    transition: all 0.1s;
    -webkit-appearance: none;
    touch-action: manipulation;
  }
  .quick-btn:active {
    transform: scale(0.95);
    background: var(--accent-yellow);
    color: #2c2300;
    border-color: var(--accent-yellow);
  }

  /* numeric keypad */
  .keypad-wrap {
    border-top: 1px solid var(--border-soft);
    padding-top: 12px;
  }
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
  }
  .keypad button {
    padding: 12px 4px;
    font-size: 18px;
    font-weight: 700;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    background: rgba(0,0,0,0.2);
    color: var(--cream);
    cursor: pointer;
    transition: all 0.08s;
    -webkit-appearance: none;
    touch-action: manipulation;
  }
  .keypad button:active {
    transform: scale(0.95);
    background: var(--accent-yellow);
    color: #2c2300;
  }
  .keypad button.key-clear {
    background: rgba(224,87,62,0.18);
    color: #ffb8a8;
    border-color: rgba(224,87,62,0.35);
    font-size: 12.5px;
    letter-spacing: 0.5px;
  }
  .keypad button.key-back {
    background: rgba(255,255,255,0.08);
    color: var(--cream);
    font-size: 16px;
  }
  .keypad button.key-enter {
    background: rgba(95,203,140,0.18);
    color: #b3f0cc;
    border-color: rgba(95,203,140,0.35);
    font-size: 12.5px;
    letter-spacing: 0.5px;
  }

  .entry-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .entry-actions button {
    flex: 1;
    margin-top: 0;
  }
  .btn-secondary {
    background: rgba(255,255,255,0.06);
    color: var(--chalk);
    border: 1px solid var(--border-soft);
  }

  .feedback {
    margin-top: 12px;
    padding: 11px 12px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    letter-spacing: 0.3px;
    display: none;
  }
  .feedback.show {
    display: block;
  }
  .feedback.fb-error {
    background: rgba(224,87,62,0.14);
    color: #ffb8a8;
    border: 1px solid rgba(224,87,62,0.35);
  }
  .feedback.fb-success {
    background: rgba(95,203,140,0.14);
    color: #b3f0cc;
    border: 1px solid rgba(95,203,140,0.35);
  }
  .feedback.fb-info {
    background: rgba(232,197,71,0.12);
    color: var(--accent-yellow);
    border: 1px solid rgba(232,197,71,0.35);
  }

  /* checkout suggestion */
  .checkout-hint {
    margin-top: 10px;
    font-size: 12px;
    color: var(--chalk-dim);
    text-align: center;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .checkout-hint strong {
    color: var(--accent-yellow);
    font-family: 'Courier New', monospace;
  }

  /* double out modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 16px;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show {
    display: flex;
  }
  .modal-box {
    background: var(--board-green);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 24px;
    text-align: center;
    max-width: 380px;
    box-shadow: 0 16px 48px var(--shadow);
  }
  .modal-box h3 {
    letter-spacing: 1px;
    font-weight: 700;
    margin: 0 0 8px;
    color: var(--accent-yellow);
  }
  .modal-box p {
    color: var(--chalk-dim);
    font-size: 14px;
    margin: 0 0 18px;
    font-weight: 500;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
  }
  .modal-actions button {
    flex: 1;
    margin-top: 0;
  }

  .winner-banner {
    text-align: center;
    background: var(--accent-yellow);
    color: #2c2300;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 13px;
    border-radius: var(--radius-sm);
    display: none;
  }
  .winner-banner.show {
    display: block;
  }

  .controls-row {
    display: flex;
    gap: 10px;
  }
  .controls-row button {
    flex: 1;
    margin-top: 0;
  }

  /* ---------- Responsive tweaks ---------- */

  /* Larger tablets (iPad) */
  @media (min-width: 700px) {
    .app { max-width: 720px; }
    .quick-grid {
      grid-template-columns: repeat(9, 1fr);
    }
    .keypad {
      grid-template-columns: repeat(6, 1fr);
      max-width: 480px;
      margin: 0 auto;
    }
    .keypad button.key-enter { grid-column: span 2; }
    .keypad button.key-clear,
    .keypad button.key-back { grid-column: span 1; }
  }

  /* Small phones (iPhone SE / compact) */
  @media (max-width: 390px) {
    .quick-btn, .keypad button { font-size: 15px; padding: 10px 2px; }
    .entry-panel { padding: 12px; }
    .player-panel { padding: 12px 8px; }
  }

  /* Short / landscape viewports */
  @media (max-height: 700px) {
    body { align-items: flex-start; padding-top: 10px; }
    .quick-grid { margin-bottom: 10px; }
    .entry-grid { margin-bottom: 10px; }
    .keypad-wrap { padding-top: 10px; }
    .entry-actions { margin-top: 10px; }
  }
</style>
</head>

  const quickGrid = document.getElementById('quickGrid');
  const keypad = document.getElementById('keypad');
  const noScoreBtn = document.getElementById('noScoreBtn');
  const feedback = document.getElementById('feedback');
  const checkoutHint = document.getElementById('checkoutHint');
  const showAnswerBtn = document.getElementById('showAnswerBtn');

  const winnerBanner = document.getElementById('winnerBanner');
  const newLegBtn = document.getElementById('newLegBtn');
  const resetBtn = document.getElementById('resetBtn');

  const doubleModal = document.getElementById('doubleModal');
  const doubleModalText = document.getElementById('doubleModalText');
  const doubleYesBtn = document.getElementById('doubleYesBtn');
  const doubleNoBtn = document.getElementById('doubleNoBtn');

  let selectedStart = 501;
  let selectedMode = 1;

  // active keypad target: 'thrown' or 'newtotal'
  let activeTarget = 'thrown';
  // raw string buffers for the two fields
  let thrownBuf = '';
  let newTotalBuf = '';

  // ---------- Mode select ----------
  const modeSelect = document.getElementById('modeSelect');
  const p2row = document.getElementById('p2row');

  modeSelect.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    modeSelect.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedMode = parseInt(btn.dataset.mode, 10);
    p2row.style.display = selectedMode === 2 ? 'block' : 'none';
  });

  // ---------- Setup screen interactions ----------
  startSelect.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    startSelect.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedStart = parseInt(btn.dataset.val, 10);
  });

  startGameBtn.addEventListener('click', () => {
    const name1 = p1nameInput.value.trim() || 'Player 1';
    const name2 = selectedMode === 2 ? (p2nameInput.value.trim() || 'Player 2') : null;
    startGame(name1, name2, selectedStart, selectedMode);
  });

  function startGame(name1, name2, startScore, playerCount) {
    state = {
      startScore,
      playerCount,
      players: playerCount === 2
        ? [makePlayer(name1, startScore), makePlayer(name2, startScore)]
        : [makePlayer(name1, startScore)],
      current: 0,
      attempts: 0,
      pendingThrown: null,
      pendingCorrect: null,
      gameOver: false
    };
    setupScreen.style.display = 'none';
    gameScreen.classList.add('active');

    // show/hide panels based on mode
    const panel1 = document.getElementById('panel1');
    if (playerCount === 1) {
      panel1.style.display = 'none';
      document.getElementById('scoreboard').style.gridTemplateColumns = '1fr';
    } else {
      panel1.style.display = '';
      document.getElementById('scoreboard').style.gridTemplateColumns = '';
    }

    document.getElementById('nametext0').textContent = name1;
    if (playerCount === 2) document.getElementById('nametext1').textContent = name2;
    clearTurnUI();
    render();
  }

  function makePlayer(name, startScore) {
    return { name, score: startScore };
  }

  // ---------- Render ----------
  function render() {
    for (let i = 0; i < state.players.length; i++) {
      const p = state.players[i];
      document.getElementById(`score${i}`).textContent = p.score;
      document.getElementById(`name${i}`).classList.toggle('is-turn', i === state.current && !state.gameOver);
      document.getElementById(`panel${i}`).classList.toggle('active-player', i === state.current && !state.gameOver);
    }

    if (state.gameOver) {
      const winner = state.players[state.winner ?? 0];
      winnerBanner.textContent = state.playerCount === 1
        ? `${winner.name} finished — well done!`
        : `${winner.name} wins the leg!`;
      winnerBanner.classList.add('show');
      entryTitle.textContent = 'Leg finished';
      noScoreBtn.disabled = true;
    } else {
      winnerBanner.classList.remove('show');
      entryTitle.textContent = `${state.players[state.current].name}'s turn`;
      noScoreBtn.disabled = false;
    }

    const cur = state.players[state.current];
    if (!state.gameOver && cur.score <= 170 && CHECKOUTS[cur.score]) {
      checkoutHint.style.display = 'block';
      checkoutHint.innerHTML = `On a finish: <strong>${cur.score}</strong> → <strong>${CHECKOUTS[cur.score]}</strong>`;
    } else {
      checkoutHint.style.display = 'none';
    }
  }

  // ---------- Field display updates ----------
  function updateFieldDisplays() {
    if (thrownBuf === '') {
      thrownDisplay.textContent = '0–180';
      thrownDisplay.classList.add('placeholder');
    } else {
      thrownDisplay.textContent = thrownBuf;
      thrownDisplay.classList.remove('placeholder');
    }

    if (state.pendingThrown === null) {
      newTotalDisplay.textContent = '—';
      newTotalDisplay.classList.add('placeholder');
      newTotalField.classList.add('disabled');
    } else {
      newTotalField.classList.remove('disabled');
      if (newTotalBuf === '') {
        newTotalDisplay.textContent = '?';
        newTotalDisplay.classList.add('placeholder');
      } else {
        newTotalDisplay.textContent = newTotalBuf;
        newTotalDisplay.classList.remove('placeholder');
      }
    }
  }

  function setActiveTarget(target) {
    if (target === 'newtotal' && state.pendingThrown === null) return;
    activeTarget = target;
    thrownField.classList.toggle('focused', target === 'thrown');
    newTotalField.classList.toggle('focused', target === 'newtotal');
  }

  thrownField.addEventListener('click', () => setActiveTarget('thrown'));
  newTotalField.addEventListener('click', () => setActiveTarget('newtotal'));

  // ---------- Quick throw buttons ----------
  quickGrid.addEventListener('click', (e) => {
    const btn = e.target.closest('.quick-btn');
    if (!btn) return;
    if (state.gameOver) return;
    if (state.pendingThrown !== null) return;
    thrownBuf = btn.dataset.val;
    setActiveTarget('thrown');
    updateFieldDisplays();
  });

  // ---------- Keypad ----------
  keypad.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    if (state.gameOver) return;
    const key = btn.dataset.key;

    if (key === 'enter') {
      handleSubmit();
      return;
    }

    let buf = (activeTarget === 'thrown') ? thrownBuf : newTotalBuf;

    if (activeTarget === 'newtotal' && state.pendingThrown === null) {
      return;
    }

    if (key === 'clear') {
      buf = '';
    } else if (key === 'back') {
      buf = buf.slice(0, -1);
    } else {
      if (buf.length >= 4) return;
      buf = (buf === '0') ? key : buf + key;
    }

    if (activeTarget === 'thrown') {
      thrownBuf = buf;
    } else {
      newTotalBuf = buf;
    }
    updateFieldDisplays();
  });

  // ---------- Physical keyboard support ----------
  document.addEventListener('keydown', (e) => {
    if (!state || state.gameOver) return;

    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT') return;

    const key = e.key;

    if (key >= '0' && key <= '9') {
      e.preventDefault();
      simulateKey(key);
    } else if (key === 'Backspace') {
      e.preventDefault();
      simulateKey('back');
    } else if (key === 'Delete' || key === 'Escape') {
      e.preventDefault();
      simulateKey('clear');
    } else if (key === 'Enter') {
      e.preventDefault();
      simulateKey('enter');
    } else if (key === 'Tab') {
      e.preventDefault();
      if (state.pendingThrown !== null) {
        setActiveTarget(activeTarget === 'thrown' ? 'newtotal' : 'thrown');
      }
    }
  });

  function simulateKey(key) {
    if (key === 'enter') {
      handleSubmit();
      return;
    }

    if (activeTarget === 'newtotal' && state.pendingThrown === null) {
      return;
    }

    let buf = (activeTarget === 'thrown') ? thrownBuf : newTotalBuf;

    if (key === 'clear') {
      buf = '';
    } else if (key === 'back') {
      buf = buf.slice(0, -1);
    } else {
      if (buf.length >= 4) return;
      buf = (buf === '0') ? key : buf + key;
    }

    if (activeTarget === 'thrown') {
      thrownBuf = buf;
    } else {
      newTotalBuf = buf;
    }
    updateFieldDisplays();
  }

  // ---------- Reset feedback UI ----------
  function clearTurnUI() {
    feedback.className = 'feedback';
    feedback.textContent = '';
    showAnswerBtn.style.display = 'none';
    state.attempts = 0;
    state.pendingThrown = null;
    state.pendingCorrect = null;
    thrownBuf = '';
    newTotalBuf = '';
    setActiveTarget('thrown');
    updateFieldDisplays();
  }

  function showFeedback(type, text) {
    feedback.className = `feedback show fb-${type}`;
    feedback.textContent = text;
  }

  // ---------- No score ----------
  noScoreBtn.addEventListener('click', () => {
    if (state.gameOver) return;
    nextPlayer();
  });

  // ---------- Submit ----------
  function handleSubmit() {
    if (state.gameOver) return;

    const cur = state.players[state.current];

    // Phase 1: validate "thrown"
    if (state.pendingThrown === null) {
      if (thrownBuf === '') {
        showFeedback('error', 'Enter the score thrown.');
        return;
      }
      const thrown = parseInt(thrownBuf, 10);
      if (isNaN(thrown) || thrown < 0 || thrown > 180) {
        showFeedback('error', 'Score thrown must be between 0 and 180.');
        return;
      }
      if (IMPOSSIBLE.has(thrown)) {
        showFeedback('error', `${thrown} is not a possible 3-dart score. Check the value.`);
        return;
      }

      const correctNew = cur.score - thrown;
      const isBust = correctNew < 0 || correctNew === 1;

      if (isBust) {
        showFeedback('error', `Bust! ${cur.score} stays unchanged.`);
        setTimeout(() => { nextPlayer(); }, 1200);
        return;
      }

      if (correctNew === 0) {
        state.pendingThrown = thrown;
        state.pendingCorrect = correctNew;
        askDoubleOut(cur, thrown);
        return;
      }

      // Normal turn: lock in thrown, move to new total
      state.pendingThrown = thrown;
      state.pendingCorrect = correctNew;
      setActiveTarget('newtotal');
      updateFieldDisplays();
      showFeedback('info', 'Now enter your new total.');
      return;
    }

    // Phase 2: verifying entered new total
    if (newTotalBuf === '') {
      showFeedback('error', 'Enter your new total.');
      return;
    }
    const entered = parseInt(newTotalBuf, 10);
    if (isNaN(entered)) {
      showFeedback('error', 'Enter a valid number.');
      return;
    }

    state.attempts += 1;
    const correct = entered === state.pendingCorrect;

    if (correct) {
      finalizeTurn(cur, state.pendingThrown, state.pendingCorrect);
      return;
    }

    if (state.attempts < 2) {
      showFeedback('error', 'Incorrect, try again.');
      newTotalBuf = '';
      updateFieldDisplays();
      return;
    } else {
      showFeedback('error', 'Incorrect, try again.');
      showAnswerBtn.style.display = 'inline-block';
      showAnswerBtn.dataset.thrown = state.pendingThrown;
      showAnswerBtn.dataset.correct = state.pendingCorrect;
    }
  }

  showAnswerBtn.addEventListener('click', () => {
    const cur = state.players[state.current];
    const thrown = parseInt(showAnswerBtn.dataset.thrown, 10);
    const correct = parseInt(showAnswerBtn.dataset.correct, 10);
    showFeedback('info', `New score: ${correct}`);
    setTimeout(() => finalizeTurn(cur, thrown, correct), 900);
  });


  // ---------- Double out modal ----------
  function askDoubleOut(player, thrown) {
    doubleModalText.textContent = `${player.name}, you'd finish on 0 (threw ${thrown}). Did you finish on a double?`;
    doubleModal.classList.add('show');
  }

  doubleYesBtn.addEventListener('click', () => {
    doubleModal.classList.remove('show');
    const cur = state.players[state.current];
    cur.score = 0;
    state.gameOver = true;
    state.winner = state.current;
    clearTurnUI();
    render();
  });

  doubleNoBtn.addEventListener('click', () => {
    doubleModal.classList.remove('show');
    const cur = state.players[state.current];
    showFeedback('error', `Bust! Must finish on a double. ${cur.score} stays unchanged.`);
    setTimeout(() => { nextPlayer(); }, 1200);
  });

  function finalizeTurn(player, thrown, correctNew) {
    player.score = correctNew;

    if (correctNew === 0) {
      state.gameOver = true;
      state.winner = state.current;
      clearTurnUI();
      render();
      return;
    }

    nextPlayer();
  }

  function nextPlayer() {
    state.current = state.playerCount === 1 ? 0 : 1 - state.current;
    clearTurnUI();
    render();
  }

  // ---------- New leg / new game ----------
  newLegBtn.addEventListener('click', () => {
    const names = state.players.map(p => p.name);
    const startScore = state.startScore;
    const playerCount = state.playerCount;
    const startingPlayer = playerCount === 2 && state.winner !== undefined ? (1 - state.winner) : 0;
    startGame(names[0], names[1] || null, startScore, playerCount);
    state.current = startingPlayer;
    clearTurnUI();
    render();
  });

  resetBtn.addEventListener('click', () => {
    if (!confirm('Start a brand new game?')) return;
    gameScreen.classList.remove('active');
    setupScreen.style.display = 'block';
    state = null;
  });

})();
</script>
</body>
</html>
